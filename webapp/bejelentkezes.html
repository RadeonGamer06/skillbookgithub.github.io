<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bejelentkezés - SkillBook</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="icon" type="image/x-icon" href="fav.png">
  <style>
    :root {
      --bg: #f5f3ff;
      --card: rgba(255,255,255,0.85);
      --border: rgba(139,92,246,0.2);
      --text: #1e1b4b;
      --muted: rgba(30,27,75,0.65);
      --accent: #7c3aed;
      --danger: #dc2626;
      --success: #059669;
      --shadow: 0 10px 40px rgba(124,58,237,0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      place-items: center;
      background: linear-gradient(135deg, #e9d5ff 0%, #d1fae5 50%, #ddd6fe 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .login-container {
      margin: auto;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }
    h2 { margin: 0 0 10px; font-size: 32px; font-weight: 800; text-align: center; }
    p.subtitle { text-align: center; color: var(--muted); margin-bottom: 30px; font-size: 15px; }
    .input-group { margin-bottom: 20px; position: relative; }
    .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 20px; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 16px;
      transition: all 0.3s ease;
    }
    input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.9); box-shadow: 0 0 0 4px rgba(124,58,237,0.15); }
    .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 14px; }
    .remember-forgot label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); }
    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,58,237,0.3); opacity: 0.9; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .message-box { padding: 12px; border-radius: 4px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .error { background: rgba(220,38,38,0.15); color: var(--danger); border: 1px solid rgba(220,38,38,0.2); }
    .success { background: rgba(5,150,105,0.15); color: var(--success); border: 1px solid rgba(5,150,105,0.2); }
    .footer-links { margin-top: 30px; text-align: center; font-size: 14px; color: var(--muted); }
    .footer-links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Üdv újra!</h2>
    <p class="subtitle">Jelentkezz be a fiókodba</p>

    <div id="messageBox" class="message-box"></div>

    <form id="loginForm">
      <div class="input-group">
        <i class='bx bx-envelope'></i>
        <input type="email" id="email" placeholder="Email cím" required>
      </div>
      <div class="input-group">
        <i class='bx bx-lock-alt'></i>
        <input type="password" id="password" placeholder="Jelszó" required>
      </div>

      <div class="remember-forgot">
  <label><input type="checkbox" id="remember" checked> Maradjak bejelentkezve</label>
  <a href="forgot-password.html" style="color: var(--accent); text-decoration: none;">Elfelejtett jelszó?</a>
</div>

      <button type="submit" class="btn-login" id="loginBtn">Bejelentkezés</button>
    </form>

    <div class="footer-links">
      Nincs még fiókod? <a href="regisztracio.html">Regisztráció</a>
    </div>
  </div>

  <script>
    const API_BASE = "/SkillBook/api";
    const REDIRECT_URL = "pro.html";

    const loginForm = document.getElementById('loginForm');
    const messageBox = document.getElementById('messageBox');
    const btn = document.getElementById('loginBtn');

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message-box ${type}`;
      messageBox.style.display = 'block';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Bejelentkezés...';

      try {
        const res = await fetch(`${API_BASE}/Users/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          if (data.user) {
              localStorage.setItem('user', JSON.stringify(data.user));
          }
          
          sessionStorage.removeItem('token');
          sessionStorage.removeItem('user');

          showMessage('Sikeres bejelentkezés! Átirányítás...', 'success');

          setTimeout(() => {
            window.location.href = REDIRECT_URL;
          }, 700);

        } else {
          const m = data.message || 'Hibás email vagy jelszó.';
          showMessage(`${m} (HTTP ${res.status})`, 'error');
          btn.disabled = false;
          btn.textContent = 'Bejelentkezés';
        }

      } catch (err) {
        console.error(err);
        showMessage('Szerver hiba történt. Ellenőrizd a kapcsolatot!', 'error');
        btn.disabled = false;
        btn.textContent = 'Bejelentkezés';
      }
    });
  </script>
</body>
</html>
