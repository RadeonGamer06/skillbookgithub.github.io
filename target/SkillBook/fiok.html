<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiókom - SkillBook</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/x-icon" href="fav.png">

    <style>
        :root {
            --bg-1: #070a14;
            --bg-2: #0f1731;
            --card: rgba(255,255,255,.08);
            --border: rgba(255,255,255,.14);
            --text: #f3f6ff;
            --muted: rgba(243,246,255,.72);
            --accent: #60a5fa;
            --accent-2: #a78bfa;
            --shadow: 0 18px 50px rgba(0,0,0,.38);
            --radius: 22px;
        }
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(900px 540px at 18% 12%, rgba(167,139,250,.35), transparent 60%),
                radial-gradient(900px 540px at 86% 22%, rgba(96,165,250,.28), transparent 55%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            padding: 40px 20px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
        }


        .Back {
      width: min(900px, calc(100% - 40px));
      margin: 100px auto 0;
      display: flex;
      flex-direction: column;
      align-items: start;
      gap: 10px;
      color: var(--muted);
    }

    .Back a {
      color: var(--text);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      transition: all 0.18s ease;
    }

    .Back a:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.08);
      border-color: rgba(122,167,255,0.3);
    }

        h1 { margin: 0 0 24px; font-size: 1.8rem; text-align: center; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--muted); }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-danger { background: #ff4d4d; color: white; margin-top: 32px; }
        .btn-danger:hover { background: #ff3333; }

        .message { margin: 16px 0; padding: 12px; border-radius: 12px; text-align: center; }
        .success { background: rgba(0,200,0,0.2); color: #0f0; }
        .error   { background: rgba(255,0,0,0.2); color: #f00; }

        .delete-section { margin-top: 48px; border-top: 1px solid var(--border); padding-top: 32px; }

        @media (max-width: 600px) {
            .profile-card { padding: 24px 16px; }
        }
    </style>
</head>
<body>

    <main>

            <div class="Back">
            <i class='bx bx-arrow-back'></i> 
            <a href="pro.html">Vissza</a>
            </div>

        <div class="profile-card">
            <h1>Fiókom</h1>

            <div id="message" class="message" style="display:none;"></div>

            <form id="profileForm">
                <div class="form-group">
                    <label for="name">Név</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">Új jelszó (hagyd üresen, ha nem akarod cserélni)</label>
                    <input type="password" id="newPassword" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="currentPassword">Jelenlegi jelszó <small>(kötelező a változásokhoz)</small></label>
                    <input type="password" id="currentPassword" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary">Mentés</button>
            </form>

            <div class="delete-section">
                <h3 style="color:#ff4d4d; margin-bottom:16px;">Fiók törlése</h3>
                <p style="color:var(--muted);">Ez a művelet végleges és nem visszavonható!</p>
                <button id="deleteAccountBtn" class="btn btn-danger">Fiók törlése</button>
            </div>
        </div>
    </main>

    <script>
        // ────────────────────────────────────────────────────────────────
        // Ugyanaz az auth logika, mint a pro.html-ben (checkAuth, showNotLoggedIn, logout, dropdown)
        // ────────────────────────────────────────────────────────────────

        const API_BASE_URL = '/SkillBook/api/Users';  // ← Itt állítsd be a helyes kontextust, pl. '/SkillBook/api/Users' vagy '/vizsgaremek/api/Users'

        function checkAuth() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');

            const userMenuContainer = document.getElementById('userMenuContainer');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const authLinks = document.getElementById('authLinks');
            const userDropdown = document.getElementById('userDropdown');

            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    userName.textContent = user.name || user.email;
                    const initial = (user.name || user.email || '?')[0].toUpperCase();
                    userAvatar.textContent = initial;

                    userMenuContainer.classList.add('visible');
                    authLinks.classList.add('hidden');
                } catch (e) {
                    console.error('Hiba a user adatok betöltésekor:', e);
                    showNotLoggedIn();
                }
            } else {
                showNotLoggedIn();
            }
        }

        function showNotLoggedIn() {
            document.getElementById('userMenuContainer')?.classList.remove('visible');
            document.getElementById('authLinks')?.classList.remove('hidden');
            document.getElementById('userDropdown')?.classList.remove('visible');
        }

        // Dropdown toggle – pontosan mint pro.html-ben
        document.addEventListener('click', function(e) {
            const trigger = document.getElementById('userMenuTrigger');
            const dropdown = document.getElementById('userDropdown');

            if (!trigger || !dropdown) return;

            if (trigger.contains(e.target)) {
                dropdown.classList.toggle('visible');
            } else if (!dropdown.contains(e.target)) {
                dropdown.classList.remove('visible');
            }
        });

        // Kijelentkezés – pontosan mint pro.html-ben
        document.getElementById('logoutBtn')?.addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            sessionStorage.removeItem('token');
            sessionStorage.removeItem('user');

            alert('Sikeresen kijelentkeztél!');
            window.location.reload();
        });

        // ────────────────────────────────────────────────────────────────
        // Profile-specifikus funkciók – ugyanaz a stílus (try-catch, console.error, showMessage)
        // ────────────────────────────────────────────────────────────────

        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + (isError ? 'error' : 'success');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 7000);
        }

        async function loadUserData() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) {
                window.location.href = 'bejelentkezes.html';
                return;
            }

            try {
                const res = await fetch(API_BASE_URL + '/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${res.status}`);
                }

                const data = await res.json();

                if (data.statusCode === 200 && data.data) {
                    document.getElementById('name').value = data.data.name || '';
                    document.getElementById('email').value = data.data.email || '';
                } else {
                    showMessage(data.message || 'Nem található felhasználói adat', true);
                }
            } catch (err) {
                console.error('Load user data error:', err);
                showMessage('Nem sikerült betölteni az adatokat: ' + err.message, true);
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const currentPassword = document.getElementById('currentPassword').value.trim();

            if (!currentPassword) {
                showMessage('Add meg a jelenlegi jelszavad!', true);
                return;
            }

            const body = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                currentPassword: currentPassword,
                newPassword: document.getElementById('newPassword').value.trim() || null
            };

            try {
                const res = await fetch(API_BASE_URL + '/updateProfile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${res.status}`);
                }

                const result = await res.json();

                if (result.statusCode === 200) {
                    showMessage('Adatok sikeresen frissítve!', false);
                    document.getElementById('newPassword').value = '';
                    document.getElementById('currentPassword').value = '';
                } else {
                    showMessage(result.message || 'Hiba történt a mentés során', true);
                }
            } catch (err) {
                console.error('Update profile error:', err);
                showMessage('Nem sikerült menteni: ' + err.message, true);
            }
        });

        document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
            if (!confirm('Biztosan törölni szeretnéd a fiókodat? Ez a művelet VISSZAVONHATATLAN!')) return;

            const token = localStorage.getItem('token') || sessionStorage.getItem('token');

            try {
                const res = await fetch(API_BASE_URL + '/deleteMe', {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${res.status}`);
                }

                const result = await res.json();

                if (result.statusCode === 200) {
                    alert('Fiókod törölve lett. Viszlát!');
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    sessionStorage.clear();
                    window.location.href = 'pro.html';
                } else {
                    showMessage(result.message || 'Hiba történt a törlés során', true);
                }
            } catch (err) {
                console.error('Delete account error:', err);
                showMessage('Nem sikerült törölni a fiókot: ' + err.message, true);
            }
        });

        // ────────────────────────────────────────────────────────────────
        // Oldal betöltésekor – ugyanaz, mint pro.html-ben
        // ────────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadUserData();
        });
    </script>
</body>
</html>
