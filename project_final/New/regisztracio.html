<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regisztráció</title>
  <link rel="stylesheet" href="regisztracio.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

  <div class="Back">
    <i class='bx bx-arrow-back'></i> 
    <a href="pro.html">Vissza</a>
  </div>

  <div class="wrapper">
    <form action="">
      <h1>Regisztráció</h1>

      <div class="input-box">
        <input type="text" placeholder="Teljes név" required>
        <i class='bx bx-id-card'></i> 
      </div>

      <div class="input-box">
        <input type="email" placeholder="Email" required>
        <i class='bx bx-envelope'></i> 
      </div>

      <div class="input-box">
        <input type="text" placeholder="Felhasználónév" required>
        <i class='bx bx-user'></i> 
      </div>

      <div class="input-box">
        <input type="password" placeholder="Jelszó" required>
        <i class='bx bx-lock'></i> 
      </div>

      <div class="input-box">
        <input type="password" placeholder="Jelszó megerősítése" required>
        <i class='bx bx-lock-alt'></i> 
      </div>

      <div class="remember-forgot">
        <label>
          <input type="checkbox" required> Elfogadom a <a href="#">felhasználási feltételeket</a>
        </label>
      </div>

      <button type="submit" class="btn">Regisztráció</button>

      <div class="register-link">
        <p>Már van profilod? <a href="bejelentkezes.html">Bejelentkezés</a></p>
      </div>
    </form>
  </div>

  <footer>
    2025 | SkillBook
  </footer>

</body>
</html>
