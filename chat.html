<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBook - Csevegés</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/x-icon" href="fav.png">
    <style>
        :root {
            --bg-1: #f5f3ff;
            --bg-2: #e9d5ff;
            --card: rgba(255,255,255,0.85);
            --border: rgba(139,92,246,0.2);
            --text: #1e1b4b;
            --muted: rgba(30,27,75,0.65);
            --accent: #7c3aed;
            --accent-2: #059669;
            --radius: 4px;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #e9d5ff 0%, #d1fae5 50%, #ddd6fe 100%);
            background-attachment: fixed;
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header styles */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 26px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all .18s ease;
        }
        .menu-toggle:hover { background: rgba(255,255,255,0.9); border-color: var(--accent); }
        .menu-toggle span { width: 20px; height: 2px; background: var(--text); border-radius: 4px; transition: all .3s ease; }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-size: 1.4rem;
            letter-spacing: .4px;
            text-decoration: none;
        }
        .logo span { color: var(--muted); font-weight: 600; }
        .logo strong {
            color: var(--text);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }
        nav a, nav button {
            color: var(--text);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.6);
            transition: transform .18s ease, background .18s ease, border-color .18s ease;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
        }
        nav a:hover, nav button:hover { transform: translateY(-1px); background: rgba(255,255,255,0.9); border-color: var(--accent); }
        nav a.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; box-shadow: 0 8px 24px rgba(124,58,237,0.2); }

        .auth-links { display: flex; gap: 10px; }
        .auth-links.hidden { display: none; }

        .user-menu-container { position: relative; display: none; }
        .user-menu-container.visible { display: block; }

        .user-menu-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.18s;
        }
        .user-menu-trigger:hover { background: rgba(255,255,255,0.6); }

        .user-info { display: flex; align-items: center; gap: 10px; padding: 4px 10px; border-radius: 4px; }

        .user-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; color: white;
            overflow: hidden; background-size: cover; background-position: center;
        }

        .user-name { font-size: 15px; font-weight: 600; color: var(--text); }
        .dropdown-arrow { font-size: 0.8rem; opacity: 0.7; }

        .user-dropdown {
            position: absolute; top: 100%; right: 0; margin-top: 8px;
            background: var(--card); border: 1px solid var(--border); border-radius: 4px;
            min-width: 180px; box-shadow: 0 10px 40px rgba(124,58,237,0.15);
            overflow: hidden; opacity: 0; transform: translateY(-8px);
            pointer-events: none; transition: all 0.18s ease; z-index: 100;
        }
        .user-dropdown.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .dropdown-item {
            display: block; width: 100%; padding: 10px 16px;
            color: var(--text); text-decoration: none;
            background: none; border: none; text-align: left; cursor: pointer; font-size: 0.95rem;
        }
        .dropdown-item:hover { background: rgba(255,255,255,0.08); }
        .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }
        .logout { color: #ff6b6b !important; }
        .logout:hover { background: rgba(255,107,107,0.15) !important; }

        @media (max-width: 991px) {
            .menu-toggle { display: flex; }
            nav {
                position: absolute; top: 100%; right: 0; left: 0;
                background: rgba(0,0,0,0.92); backdrop-filter: blur(14px);
                border-bottom: 1px solid var(--border);
                flex-direction: column; align-items: stretch;
                padding: 16px 26px; gap: 8px;
                max-height: 0; overflow: hidden; opacity: 0; transition: all .3s ease;
            }
            nav.active { max-height: 500px; opacity: 1; }
            nav a, nav button { color: white; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.15); }
            nav a:hover, nav button:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
            nav a.active { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.6); }
            .user-menu-trigger { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
            .user-name { color: white; }
            .dropdown-arrow { color: white; }
        }

        /* ════════ CHAT LAYOUT ════════ */
        .chat-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            flex: 1;
            overflow: hidden;
            background: var(--bg-1);
        }

        /* ════════ SIDEBAR ════════ */
        .sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.6);
            overflow: hidden;
        }

        .search-container {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .search-container input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 4px;
            color: var(--text);
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .search-container input:focus { border-color: var(--accent); }

        /* Szűrő gombok */
        .filter-row {
            display: flex;
            gap: 6px;
        }
        .filter-btn {
            flex: 1;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.6);
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.9); border-color: var(--accent); }
        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            border-color: transparent;
        }

        .user-lists {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .list-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            margin: 15px 10px 8px;
            letter-spacing: 1px;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.15s;
            margin-bottom: 3px;
            gap: 10px;
        }
        .user-item:hover { background: var(--card); }
        .user-item.active { background: var(--accent); color: white; }
        .user-item.active .user-item-sub { color: rgba(255,255,255,0.75); }

        .chat-user-avatar {
            width: 40px; height: 40px; min-width: 40px;
            background: var(--border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 15px;
            overflow: hidden; flex-shrink: 0;
        }
        .chat-user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-item-info { flex: 1; min-width: 0; }
        .user-item-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-item-sub { font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

        .role-tag {
            font-size: 0.68rem; font-weight: 700;
            padding: 1px 6px; border-radius: 10px;
            display: inline-block; margin-top: 2px;
        }
        .role-student  { background: rgba(5,150,105,0.12);  color: #059669; }
        .role-instructor { background: rgba(124,58,237,0.12); color: #7c3aed; }
        .role-admin    { background: rgba(239,68,68,0.12);  color: #dc2626; }

        .empty-msg {
            text-align: center;
            padding: 20px 10px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ════════ CHAT MAIN ════════ */
        .chat-main {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.4);
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            background: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 60px;
        }
        .chat-header-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--border); display: none;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; overflow: hidden;
        }
        .chat-header-avatar.show { display: flex; }
        .chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-header-info { display: flex; flex-direction: column; }
        .chat-header-name { font-size: 1rem; }
        .chat-header-role { font-size: 0.76rem; color: var(--muted); font-weight: 400; }

        #messagesContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-placeholder {
            margin: auto;
            text-align: center;
            color: var(--muted);
            opacity: 0.6;
        }
        .chat-placeholder i { font-size: 3rem; display: block; margin-bottom: 10px; }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.45;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .sent { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        .msg-time {
            font-size: 0.68rem; opacity: 0.65; margin-top: 4px;
            display: block; text-align: right;
        }
        .received .msg-time { text-align: left; }

        .date-sep {
            text-align: center; font-size: 0.72rem; color: var(--muted);
            margin: 6px 0; position: relative;
        }
        .date-sep::before, .date-sep::after {
            content: ''; position: absolute; top: 50%;
            width: 28%; height: 1px; background: var(--border);
        }
        .date-sep::before { left: 0; } .date-sep::after { right: 0; }

        .message-input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.6);
        }
        .message-input-area input {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 4px;
            color: var(--text);
            outline: none;
            font-family: inherit;
            font-size: 0.93rem;
        }
        .message-input-area input:focus { border-color: var(--accent); }
        .message-input-area input:disabled { opacity: 0.5; cursor: not-allowed; }

        .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: opacity .15s;
        }
        .send-btn:hover { opacity: 0.88; }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Dark Mode */
        [data-theme="dark"] body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); background-attachment: fixed; color: #f1f5f9; }
        [data-theme="dark"] header { background: rgba(30,41,59,0.9); }
        [data-theme="dark"] nav a, [data-theme="dark"] nav button { background: rgba(51,65,85,0.6); color: #f1f5f9; }
        [data-theme="dark"] nav a:hover, [data-theme="dark"] nav button:hover { background: rgba(51,65,85,0.9); color: #f1f5f9; }
        [data-theme="dark"] .user-menu-trigger { color: #f1f5f9; }
        [data-theme="dark"] .user-menu-trigger:hover { background: rgba(51,65,85,0.6); }
        [data-theme="dark"] .user-name { color: #f1f5f9; }
        [data-theme="dark"] .dropdown-arrow { color: #f1f5f9; }
        [data-theme="dark"] .user-dropdown { background: rgba(30,41,59,0.98); }
        [data-theme="dark"] .dropdown-item { color: #f1f5f9; }
        [data-theme="dark"] .dropdown-item:hover { background: rgba(124,58,237,0.25); }
        [data-theme="dark"] .sidebar { background: rgba(30,41,59,0.8); }
        [data-theme="dark"] .chat-main { background: rgba(15,23,42,0.6); }
        [data-theme="dark"] .chat-header { background: rgba(30,41,59,0.8); color: #f1f5f9; }
        [data-theme="dark"] .chat-header-role { color: rgba(241,245,249,0.6); }
        [data-theme="dark"] .message.received { background: rgba(30,41,59,0.9); color: #f1f5f9; border-color: rgba(139,92,246,0.25); }
        [data-theme="dark"] .message-input-area { background: rgba(30,41,59,0.8); }
        [data-theme="dark"] .message-input-area input { background: rgba(15,23,42,0.8); color: #f1f5f9; border-color: rgba(139,92,246,0.4); }
        [data-theme="dark"] .search-container input { background: rgba(15,23,42,0.8); color: #f1f5f9; border-color: rgba(139,92,246,0.4); }
        [data-theme="dark"] .user-item { color: #f1f5f9; }
        [data-theme="dark"] .user-item:hover { background: rgba(51,65,85,0.6); }
        [data-theme="dark"] .list-section-title { color: rgba(241,245,249,0.5); }
        [data-theme="dark"] .user-item-sub { color: rgba(241,245,249,0.55); }
        [data-theme="dark"] .empty-msg { color: rgba(241,245,249,0.5); }
        [data-theme="dark"] .menu-toggle span { background: #f1f5f9; }
        [data-theme="dark"] .menu-toggle { background: rgba(51,65,85,0.6); }
        [data-theme="dark"] .menu-toggle:hover { background: rgba(51,65,85,0.9); }
        [data-theme="dark"] .filter-btn { background: rgba(51,65,85,0.6); color: #f1f5f9; border-color: rgba(139,92,246,0.3); }
        [data-theme="dark"] .filter-btn:hover { background: rgba(51,65,85,0.9); }
        [data-theme="dark"] input::placeholder, [data-theme="dark"] textarea::placeholder { color: rgba(241,245,249,0.45); }
        [data-theme="dark"] .logo span { color: rgba(241,245,249,0.7); }

        /* ── Chat oldal hiányzó szövegszínek sötét módban ── */

        /* Felhasználónevek a sidebar listában */
        [data-theme="dark"] .user-item-name { color: #f1f5f9; }

        /* Sidebar avatar betű */
        [data-theme="dark"] .chat-user-avatar {
            color: #f1f5f9;
            background: rgba(71,85,105,0.7);
        }

        /* Chat fejléc partner neve */
        [data-theme="dark"] .chat-header-name { color: #f1f5f9; }

        /* Chat fejléc avatar betű */
        [data-theme="dark"] .chat-header-avatar {
            color: #f1f5f9;
            background: rgba(71,85,105,0.8);
        }

        /* Üzenetek időbélyege */
        [data-theme="dark"] .message.received .msg-time { color: rgba(241,245,249,0.5); }
        [data-theme="dark"] .message.sent    .msg-time { color: rgba(255,255,255,0.6); }

        /* Dátum elválasztó (Ma / Tegnap) */
        [data-theme="dark"] .date-sep { color: rgba(241,245,249,0.45); }

        /* Üres állapot / üdvözlő szöveg */
        [data-theme="dark"] .chat-placeholder { color: rgba(241,245,249,0.45); }
        [data-theme="dark"] .chat-placeholder p { color: rgba(241,245,249,0.45); }

        /* Role badge-ek sötét alapon */
        [data-theme="dark"] .role-tag.role-student    { background: rgba(5,150,105,0.2);   color: #34d399; }
        [data-theme="dark"] .role-tag.role-instructor { background: rgba(139,92,246,0.2);  color: #a78bfa; }
        [data-theme="dark"] .role-tag.role-admin      { background: rgba(239,68,68,0.2);   color: #f87171; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Menu toggle">
            <span></span><span></span><span></span>
        </button>
        <a href="pro.html" class="logo"><span>Skill</span><strong>Book</strong></a>
    </div>

    <nav id="mainNav">
        <a href="pro.html">Kezdőlap</a>
        <a href="courses.html">Tanfolyamok</a>
        <a href="my-courses.html" id="myCoursesNav" style="display:none;">Tanfolyamaim</a>
        <a href="kapcsolat.html">Kapcsolat</a>
        <a href="chat.html" class="active">Csevegés</a>

        <div id="authLinks" class="auth-links">
            <a href="bejelentkezes.html">Bejelentkezés</a>
            <a href="regisztracio.html">Regisztráció</a>
        </div>

        <div class="user-menu-container" id="userMenuContainer">
            <button class="user-menu-trigger" id="userMenuTrigger">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <span class="user-name" id="userName">Vendég</span>
                </div>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="user-dropdown" id="userDropdown">
                <a href="fiok.html" class="dropdown-item">Fiókom</a>
                <a href="beallitasok.html" class="dropdown-item">Beállítások</a>
                <div class="dropdown-divider"></div>
                <button id="logoutBtnNav" class="dropdown-item logout">Kijelentkezés</button>
            </div>
        </div>
    </nav>
</header>

<div class="chat-container">

    <!-- ════════ SIDEBAR ════════ -->
    <div class="sidebar">
        <div class="search-container">
            <input type="text" id="userSearch" placeholder="Keresés név vagy email alapján...">
            <div class="filter-row">
                <button class="filter-btn active" data-role="all">Mindenki</button>
                <button class="filter-btn" data-role="student">Diákok</button>
                <button class="filter-btn" data-role="instructor">Tanárok</button>
            </div>
        </div>

        <div class="user-lists" id="userLists">
            <!-- Korábbi beszélgetések -->
            <div id="recentSection" style="display:none;">
                <div class="list-section-title">Korábbi beszélgetések</div>
                <div id="recentChats"></div>
            </div>

            <!-- Összes többi felhasználó -->
            <div id="allSection">
                <div class="list-section-title">Összes felhasználó</div>
                <div id="allUsersList">
                    <div class="empty-msg">Betöltés...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ════════ CHAT FŐTERÜLET ════════ -->
    <div class="chat-main">
        <div class="chat-header" id="chatHeader">
            <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
            <div class="chat-header-info">
                <span class="chat-header-name" id="chatPartnerName">Válassz egy partnert a kezdéshez</span>
                <span class="chat-header-role" id="chatPartnerRole"></span>
            </div>
        </div>

        <div id="messagesContainer">
            <div class="chat-placeholder">
                <i class='bx bx-message-rounded-dots'></i>
                <p>Válassz egy felhasználót a csevegés megkezdéséhez</p>
            </div>
        </div>

        <div class="message-input-area">
            <input type="text" id="messageInput" placeholder="Írj egy üzenetet..." autocomplete="off" disabled>
            <button class="send-btn" id="sendBtn" disabled>
                <i class='bx bxs-send'></i>
            </button>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// KONFIGURÁCIÓ - igazítsd a projekt nevéhez!
// ════════════════════════════════════════════════════════════════════
const API = '/SkillBook/api';

// ════════════════════════════════════════════════════════════════════
// ÁLLAPOT
// ════════════════════════════════════════════════════════════════════
let myId           = null;   // bejelentkezett user ID-ja
let allUsers       = [];     // /api/chat/users válasza (mind)
let activeFilter   = 'all';  // 'all' | 'student' | 'instructor'
let selectedId     = null;   // kiválasztott partner ID
let selectedUser   = null;   // kiválasztott partner adatai
let pollTimer      = null;   // üzenet polling időzítő

// ════════════════════════════════════════════════════════════════════
// TÉMA (azonnal alkalmazza, villanás nélkül)
// ════════════════════════════════════════════════════════════════════
(function(){
    if (localStorage.getItem('theme') === 'dark')
        document.documentElement.setAttribute('data-theme','dark');
})();

// ════════════════════════════════════════════════════════════════════
// TOKEN SEGÉDLET
// ════════════════════════════════════════════════════════════════════
function getToken() {
    return localStorage.getItem('token') || sessionStorage.getItem('token');
}
function authHdr() {
    return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
}

// ════════════════════════════════════════════════════════════════════
// HAMBURGER MENÜ
// ════════════════════════════════════════════════════════════════════
document.getElementById('menuToggle')?.addEventListener('click', () =>
    document.getElementById('mainNav')?.classList.toggle('active')
);

// ════════════════════════════════════════════════════════════════════
// USER DROPDOWN
// ════════════════════════════════════════════════════════════════════
const trigger  = document.getElementById('userMenuTrigger');
const dropdown = document.getElementById('userDropdown');
trigger?.addEventListener('click', e => {
    e.stopPropagation();
    dropdown?.classList.toggle('visible');
});
document.addEventListener('click', e => {
    if (trigger && !trigger.contains(e.target)) dropdown?.classList.remove('visible');
});

// KIJELENTKEZÉS
document.getElementById('logoutBtnNav')?.addEventListener('click', () => {
    ['token','user'].forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k); });
    window.location.href = 'pro.html';
});

// ════════════════════════════════════════════════════════════════════
// AUTH ELLENŐRZÉS ÉS FEJLÉC FRISSÍTÉS
// ════════════════════════════════════════════════════════════════════
async function initAuth() {
    if (!getToken()) { window.location.href = 'bejelentkezes.html'; return false; }
    try {
        const res  = await fetch(API + '/Users/me', { headers: authHdr() });
        const json = await res.json();
        if (!res.ok || json.statusCode !== 200) throw new Error('auth');

        const user = json.data;
        myId = user.id;

        // Header felhasználói menü
        document.getElementById('userName').textContent = user.name || user.email || 'Felhasználó';
        const av = document.getElementById('userAvatar');
        if (user.profilePicture) {
            av.style.backgroundImage = `url(${buildImgUrl(user.profilePicture)})`;
            av.style.backgroundSize  = 'cover';
            av.style.backgroundPosition = 'center';
            av.textContent = '';
        } else {
            av.textContent = (user.name || user.email || '?')[0].toUpperCase();
        }
        document.getElementById('userMenuContainer').classList.add('visible');
        document.getElementById('authLinks').classList.add('hidden');

        // Tanfolyamaim link (csak oktatónak, ha van kurzusa)
        if (user.role === 'instructor') checkMyCoursesNav(user.id);

        return true;
    } catch {
        ['token','user'].forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k); });
        window.location.href = 'bejelentkezes.html';
        return false;
    }
}

async function checkMyCoursesNav(instructorId) {
    try {
        const r = await fetch(API + '/Courses/getAllCourses');
        const j = await r.json();
        const courses = Array.isArray(j?.data) ? j.data : [];
        const link = document.getElementById('myCoursesNav');
        if (link) link.style.display =
            courses.some(c => String(c.instructor_id) === String(instructorId)) ? 'inline-flex' : 'none';
    } catch { /* csendes */ }
}

// ════════════════════════════════════════════════════════════════════
// FELHASZNÁLÓK BETÖLTÉSE  →  GET /api/chat/users
// ════════════════════════════════════════════════════════════════════
async function loadUsers() {
    try {
        const res  = await fetch(API + '/chat/users', { headers: authHdr() });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || res.status);
        allUsers = Array.isArray(json.data) ? json.data : [];
        renderSidebar();
    } catch (e) {
        document.getElementById('allUsersList').innerHTML =
            '<div class="empty-msg">⚠️ Nem sikerült betölteni a felhasználókat.<br>' + e.message + '</div>';
    }
}

// ════════════════════════════════════════════════════════════════════
// SIDEBAR RENDERELÉS (szűrő + keresés figyelembevételével)
// ════════════════════════════════════════════════════════════════════
function renderSidebar() {
    const searchVal = document.getElementById('userSearch').value.trim().toLowerCase();

    // Szűrés: role + keresőszó
    const filtered = allUsers.filter(u => {
        const roleOk   = activeFilter === 'all' || u.role === activeFilter;
        const searchOk = !searchVal ||
            (u.name  && u.name.toLowerCase().includes(searchVal)) ||
            (u.email && u.email.toLowerCase().includes(searchVal));
        return roleOk && searchOk;
    });

    // Akikkel volt már beszélgetés (hasConversation = true) → "Korábbi" szekció
    const recent = filtered.filter(u => u.hasConversation)
        .sort((a,b) => (b.lastMessageAt || '').localeCompare(a.lastMessageAt || ''));
    const others = filtered.filter(u => !u.hasConversation);

    // ── Korábbi beszélgetések ──
    const recentSection = document.getElementById('recentSection');
    const recentDiv     = document.getElementById('recentChats');
    if (recent.length > 0) {
        recentSection.style.display = 'block';
        recentDiv.innerHTML = recent.map(u => userItemHtml(u, true)).join('');
    } else {
        recentSection.style.display = 'none';
        recentDiv.innerHTML = '';
    }

    // ── Összes többi felhasználó ──
    const allDiv = document.getElementById('allUsersList');
    if (others.length > 0) {
        allDiv.innerHTML = others.map(u => userItemHtml(u, false)).join('');
    } else if (filtered.length === 0) {
        allDiv.innerHTML = '<div class="empty-msg">Nincs találat.</div>';
    } else {
        allDiv.innerHTML = ''; // mindenki a recent-ben van
    }
}

function userItemHtml(u, showPreview) {
    const isActive = u.id === selectedId;
    const initial  = (u.name || u.email || '?')[0].toUpperCase();
    const avatarInner = u.profilePicture
        ? `<img src="${esc(buildImgUrl(u.profilePicture))}" onerror="this.style.display='none'">`
        : initial;
    const roleMap  = { student: 'Diák', instructor: 'Tanár', admin: 'Admin' };
    const roleText = roleMap[u.role] || u.role || '';
    const roleCls  = 'role-' + (u.role || 'student');
    const sub = showPreview && u.lastMessagePreview
        ? esc(u.lastMessagePreview)
        : `${esc(u.email || '')} <span class="role-tag ${roleCls}">${esc(roleText)}</span>`;

    return `
        <div class="user-item${isActive ? ' active' : ''}"
             onclick="selectPartner(${u.id})" data-uid="${u.id}">
            <div class="chat-user-avatar">${avatarInner}</div>
            <div class="user-item-info">
                <div class="user-item-name">${esc(u.name || u.email || 'Ismeretlen')}</div>
                <div class="user-item-sub">${sub}</div>
            </div>
        </div>`;
}

// ════════════════════════════════════════════════════════════════════
// PARTNER KIVÁLASZTÁSA
// ════════════════════════════════════════════════════════════════════
function selectPartner(partnerId) {
    selectedId   = partnerId;
    selectedUser = allUsers.find(u => u.id === partnerId) || { id: partnerId, name: 'Felhasználó' };

    // Aktív kiemelés frissítése a DOM-ban
    document.querySelectorAll('.user-item').forEach(el => {
        el.classList.toggle('active', Number(el.dataset.uid) === partnerId);
    });

    // Fejléc frissítése
    const nameEl   = document.getElementById('chatPartnerName');
    const roleEl   = document.getElementById('chatPartnerRole');
    const avatarEl = document.getElementById('chatHeaderAvatar');
    const roleMap  = { student: 'Diák', instructor: 'Tanár', admin: 'Admin' };

    nameEl.textContent = selectedUser.name || selectedUser.email || 'Felhasználó';
    roleEl.textContent = roleMap[selectedUser.role] || selectedUser.role || '';
    avatarEl.classList.add('show');
    if (selectedUser.profilePicture) {
        avatarEl.innerHTML = `<img src="${esc(buildImgUrl(selectedUser.profilePicture))}"
            onerror="this.style.display='none'">`;
    } else {
        avatarEl.textContent = (selectedUser.name || '?')[0].toUpperCase();
    }

    // Input engedélyezése
    document.getElementById('messageInput').disabled = false;
    document.getElementById('sendBtn').disabled      = false;
    document.getElementById('messageInput').focus();

    // Üzenetek azonnal + polling
    loadMessages();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadMessages, 3000);
}

// ════════════════════════════════════════════════════════════════════
// ÜZENETEK LEKÉRÉSE  →  GET /api/chat/messages?partnerId=X
// ════════════════════════════════════════════════════════════════════
async function loadMessages() {
    if (!selectedId) return;
    try {
        const res  = await fetch(`${API}/chat/messages?partnerId=${selectedId}`, { headers: authHdr() });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || res.status);
        renderMessages(Array.isArray(json.data) ? json.data : []);
    } catch (e) {
        console.error('Üzenetek betöltési hiba:', e);
    }
}

function renderMessages(messages) {
    const container = document.getElementById('messagesContainer');
    const atBottom  = container.scrollHeight - container.clientHeight - container.scrollTop < 80;

    if (!messages.length) {
        container.innerHTML = `
            <div class="chat-placeholder">
                <i class='bx bx-message-add'></i>
                <p>Kezdj el csevegni ${esc(selectedUser?.name || 'ezzel a felhasználóval')}!</p>
            </div>`;
        return;
    }

    let html = '';
    let lastDay = '';
    messages.forEach(m => {
        const day = dayLabel(m.sentAt);
        if (day !== lastDay) {
            html += `<div class="date-sep">${esc(day)}</div>`;
            lastDay = day;
        }
        const isMine = m.isMe || m.senderId === myId;
        html += `
            <div class="message ${isMine ? 'sent' : 'received'}">
                ${esc(m.content)}
                <span class="msg-time">${timeStr(m.sentAt)}</span>
            </div>`;
    });

    container.innerHTML = html;
    if (atBottom) container.scrollTop = container.scrollHeight;
}

// ════════════════════════════════════════════════════════════════════
// ÜZENET KÜLDÉSE  →  POST /api/chat/send
// ════════════════════════════════════════════════════════════════════
async function sendMessage() {
    const input   = document.getElementById('messageInput');
    const content = input.value.trim();
    if (!content || !selectedId) return;

    input.value = '';
    document.getElementById('sendBtn').disabled = true;

    try {
        const res = await fetch(API + '/chat/send', {
            method: 'POST',
            headers: authHdr(),
            body: JSON.stringify({ receiverId: selectedId, content })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || res.status);

        // Ha az üzenet elküldése sikerült, az adott user kerüljön a recent-be
        const u = allUsers.find(u => u.id === selectedId);
        if (u) {
            u.hasConversation    = true;
            u.lastMessageAt      = new Date().toISOString();
            u.lastMessagePreview = content.length > 55 ? content.substring(0,52)+'...' : content;
        }

        await loadMessages();
        renderSidebar();

    } catch (e) {
        console.error('Küldési hiba:', e);
        input.value = content; // visszaírjuk
        alert('Nem sikerült elküldeni az üzenetet: ' + e.message);
    } finally {
        document.getElementById('sendBtn').disabled = false;
        input.focus();
    }
}

// Küldés: gombkattintás
document.getElementById('sendBtn').addEventListener('click', sendMessage);
// Küldés: Enter billentyű
document.getElementById('messageInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ════════════════════════════════════════════════════════════════════
// SZŰRŐ GOMBOK
// ════════════════════════════════════════════════════════════════════
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeFilter = this.dataset.role;
        renderSidebar();
    });
});

// ════════════════════════════════════════════════════════════════════
// KERESÉS
// ════════════════════════════════════════════════════════════════════
let searchTimer;
document.getElementById('userSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderSidebar, 220);
});

// ════════════════════════════════════════════════════════════════════
// SEGÉDFÜGGVÉNYEK
// ════════════════════════════════════════════════════════════════════
function esc(str) {
    return String(str ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildImgUrl(path) {
    if (!path) return '';
    if (path.startsWith('http')) return path;
    return window.location.origin + (path.startsWith('/') ? '' : '/') + path;
}

function timeStr(raw) {
    if (!raw) return '';
    // Java LocalDateTime.toString() → "2025-04-20T14:35:22.123" – replace T with space
    const d = new Date(String(raw).replace('T',' '));
    if (isNaN(d)) return '';
    return d.toLocaleTimeString('hu-HU', { hour:'2-digit', minute:'2-digit' });
}

function dayLabel(raw) {
    if (!raw) return '';
    const d   = new Date(String(raw).replace('T',' '));
    if (isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return 'Ma';
    const y = new Date(now); y.setDate(now.getDate()-1);
    if (d.toDateString() === y.toDateString()) return 'Tegnap';
    return d.toLocaleDateString('hu-HU', { year:'numeric', month:'long', day:'numeric' });
}

// ════════════════════════════════════════════════════════════════════
// INICIALIZÁLÁS
// ════════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await initAuth();
    if (ok) await loadUsers();
});

window.addEventListener('beforeunload', () => {
    if (pollTimer) clearInterval(pollTimer);
});
</script>
