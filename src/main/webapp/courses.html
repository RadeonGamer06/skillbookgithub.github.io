<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanfolyamok | SkillBook</title>
  <link rel="icon" type="image/x-icon" href="fav.png">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <style>
    :root {
      --bg-1: #f5f3ff;
      --bg-2: #e9d5ff;
      --card: rgba(255,255,255,0.85);
      --card-2: rgba(255,255,255,0.7);
      --border: rgba(139,92,246,0.2);
      --text: #1e1b4b;
      --muted: rgba(30,27,75,0.65);
      --accent: #7c3aed;
      --accent-2: #059669;
      --shadow: 0 10px 40px rgba(124,58,237,0.15);
      --radius: 4px;
    }

    [data-theme="dark"] {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(30,41,59,0.85);
      --card-2: rgba(30,41,59,0.7);
      --border: rgba(139,92,246,0.3);
      --text: #f1f5f9;
      --muted: rgba(241,245,249,0.65);
      --accent: #7c3aed;
      --accent-2: #059669;
      --shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; }
    
    html, body { 
      height: 100%;
      margin: 0;
    }
    
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-2) 0%, var(--bg-1) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -120px -140px auto auto;
      width: 560px;
      height: 560px;
      background: radial-gradient(circle at 35% 35%, rgba(124,58,237,0.25), transparent 62%);
      filter: blur(55px);
      opacity: .55;
      z-index: -1;
      animation: floatGlow 12s ease-in-out infinite;
    }
    
    @keyframes floatGlow {
      0%,100% { transform: translate3d(0,0,0) rotate(0deg); }
      50% { transform: translate3d(-20px, 16px, 0) rotate(10deg); }
    }

    /* Header Styles */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 26px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s ease;
    }

    [data-theme="dark"] header {
      background: rgba(30,41,59,0.8);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      cursor: pointer;
      transition: all .18s ease;
    }

    [data-theme="dark"] .menu-toggle {
      background: rgba(30,41,59,0.6);
    }

    .menu-toggle:hover {
      background: rgba(255,255,255,0.9);
      border-color: var(--accent);
    }

    [data-theme="dark"] .menu-toggle:hover {
      background: rgba(30,41,59,0.9);
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      background: var(--text);
      border-radius: 4px;
      transition: all .3s ease;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 2px;
      font-size: 1.4rem;
      letter-spacing: .4px;
      text-decoration: none;
    }
    
    .logo span { 
      color: var(--muted); 
      font-weight: 600; 
    }
    
    .logo strong {
      color: var(--text);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
    }
    
    nav a, nav button {
      color: var(--text);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.6);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
    }

    [data-theme="dark"] nav a,
    [data-theme="dark"] nav button {
      background: rgba(30,41,59,0.6);
    }
    
    nav a:hover, nav button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.9);
      border-color: var(--accent);
    }

    [data-theme="dark"] nav a:hover,
    [data-theme="dark"] nav button:hover {
      background: rgba(30,41,59,0.9);
    }
    
    nav a.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(124,58,237,0.2);
    }

    .auth-links {
      display: flex;
      gap: 10px;
    }
    
    .auth-links.hidden {
      display: none;
    }

    .user-menu-container {
      position: relative;
      display: none;
    }
    
    .user-menu-container.visible {
      display: block;
    }

    .user-menu-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.18s;
    }
    
    .user-menu-trigger:hover {
      background: rgba(255,255,255,0.6);
    }

    [data-theme="dark"] .user-menu-trigger:hover {
      background: rgba(30,41,59,0.6);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
    }

    .user-name {
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }

    .dropdown-arrow {
      font-size: 18px;
      color: var(--text);
      transition: transform 0.2s;
    }

    .user-menu-trigger.active .dropdown-arrow {
      transform: rotate(180deg);
    }

    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 0;
      min-width: 180px;
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s ease;
    }

    [data-theme="dark"] .user-dropdown {
      background: rgba(30,41,59,0.95);
    }

    .user-dropdown.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      color: var(--text);
      text-decoration: none;
      transition: background 0.18s;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: rgba(124,58,237,0.1);
    }

    .dropdown-item i {
      font-size: 18px;
    }

    /* Main Content */
    main {
      flex: 1;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .page-header h1 {
      font-size: 2.5rem;
      margin: 0 0 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page-header p {
      font-size: 1.1rem;
      color: var(--muted);
      margin: 0;
    }

    /* Courses Grid */
    #coursesContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 28px;
      margin-top: 32px;
    }

    .course-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .course-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(124,58,237,0.25);
      border-color: var(--accent);
    }

    .course-header {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      padding: 24px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .course-header::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    .course-icon {
      position: relative;
      z-index: 1;
      width: 56px;
      height: 56px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    .course-icon i {
      font-size: 28px;
      color: white;
    }

    .course-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .course-meta i {
      font-size: 16px;
    }

    .course-content {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .course-content h3 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      color: var(--text);
      line-height: 1.3;
    }

    .course-description {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .course-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 24px;
    }

    .course-price {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .course-price i {
      font-size: 22px;
    }

    .btn-enroll {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(124,58,237,0.3);
    }

    .btn-enroll:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124,58,237,0.4);
    }

    .btn-enroll i {
      font-size: 18px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .empty-state i {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 1.2rem;
      margin: 0;
    }

    /* Loading State */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
      grid-column: 1 / -1;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Message Box */
    .message-box {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      z-index: 1001;
      display: none;
      animation: slideIn 0.3s ease;
      backdrop-filter: blur(12px);
      font-size: 14px;
      border: 1px solid var(--border);
      max-width: 400px;
    }

    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .message-box.success {
      background: rgba(5,150,105,0.9);
      color: white;
      border-color: rgba(5,150,105,0.5);
    }

    .message-box.error {
      background: rgba(220,38,38,0.9);
      color: white;
      border-color: rgba(220,38,38,0.5);
    }

    .message-box.info {
      background: rgba(59,130,246,0.9);
      color: white;
      border-color: rgba(59,130,246,0.5);
    }

    /* Footer */
    footer {
      width: 100%;
      text-align: center;
      padding: 22px 14px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      transition: background 0.3s ease;
    }

    [data-theme="dark"] footer {
      background: rgba(30,41,59,0.8);
    }

    /* Mobile Responsive */
    @media (max-width: 991px) {
      .menu-toggle {
        display: flex;
      }

      nav {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        background: rgba(139, 92, 246, 0.95);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        flex-direction: column;
        align-items: stretch;
        padding: 16px 26px;
        gap: 8px;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: all .3s ease;
      }

      nav.active {
        max-height: 500px;
        opacity: 1;
      }
      
      nav a, nav button {
        color: white;
        border-color: rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.15);
      }
      
      nav a:hover, nav button:hover {
        background: rgba(255,255,255,0.25);
        border-color: rgba(255,255,255,0.5);
      }
      
      nav a.active {
        background: rgba(255,255,255,0.3);
        border-color: rgba(255,255,255,0.6);
      }
      
      .user-menu-trigger {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.3);
        color: white;
      }
      
      .user-name, .dropdown-arrow {
        color: white;
      }

      #coursesContainer {
        grid-template-columns: 1fr;
      }

      .page-header h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 768px) {
      main {
        padding: 24px 16px;
      }

      .page-header h1 {
        font-size: 1.75rem;
      }

      .course-card {
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a href="pro.html" class="logo">
        <span>Skill</span><strong>Book</strong>
      </a>
    </div>

    <nav id="mainNav">
      <a href="pro.html">Főoldal</a>
      <a href="courses.html" class="active">Tanfolyamok</a>
      <a href="chat.html" id="chatLink" style="display:none;">Chat</a>
      <a href="beallitasok.html" id="settingsLink" style="display:none;">Beállítások</a>
      <a href="#" id="myCoursesNav" style="display:none;">Saját kurzusaim</a>

      <div class="auth-links" id="authLinks">
        <a href="bejelentkezes.html">Bejelentkezés</a>
        <a href="regisztracio.html">Regisztráció</a>
      </div>

      <div class="user-menu-container" id="userMenuContainer">
        <button class="user-menu-trigger" id="userMenuTrigger">
          <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <span class="user-name" id="userName">Felhasználó</span>
            <i class='bx bx-chevron-down dropdown-arrow'></i>
          </div>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <a href="fiok.html" class="dropdown-item">
            <i class='bx bx-user'></i>
            <span>Profilom</span>
          </a>
          <a href="beallitasok.html" class="dropdown-item">
            <i class='bx bx-cog'></i>
            <span>Beállítások</span>
          </a>
          <a href="#" class="dropdown-item" id="logoutBtn">
            <i class='bx bx-log-out'></i>
            <span>Kijelentkezés</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1>Elérhető tanfolyamok</h1>
      <p>Válassz a széles tanfolyam kínálatunkból és kezdd el a tanulást még ma!</p>
    </div>

    <div id="coursesContainer">
      <div class="loading-container">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </main>

  <footer>
    2025 | SkillBook
  </footer>

  <div id="messageBox" class="message-box"></div>

<script>
    const API_BASE_URL = '/SkillBook/api';

    // Apply saved theme immediately
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();

    // Auth headers helper
    function authHeaders() {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        return {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
    }

    // Hamburger menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');

    if (menuToggle && mainNav) {
        menuToggle.addEventListener('click', () => {
            mainNav.classList.toggle('active');
        });
    }

    // Check for instructor's own courses
    async function checkMyCoursesNav() {
        const link = document.getElementById('myCoursesNav');
        if (!link) return;

        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
        if (!token || !userStr) { link.style.display = 'none'; return; }

        let user;
        try { user = JSON.parse(userStr); } catch(e) { link.style.display = 'none'; return; }

        if (!user || user.role !== 'instructor') { link.style.display = 'none'; return; }

        try {
            const meRes = await fetch(API_BASE_URL + '/Users/me', { headers: authHeaders() });
            if (!meRes.ok) { link.style.display = 'none'; return; }
            const meJson = await meRes.json();
            const myId = meJson?.data?.id;
            if (!myId) { link.style.display = 'none'; return; }

            const cRes = await fetch(API_BASE_URL + '/Courses/getAllCourses');
            if (!cRes.ok) { link.style.display = 'none'; return; }
            const cJson = await cRes.json();
            const courses = Array.isArray(cJson?.data) ? cJson.data : [];
            const myCourses = courses.filter(c => String(c.instructor_id) === String(myId));

            link.style.display = myCourses.length > 0 ? 'inline-flex' : 'none';
        } catch (e) {
            link.style.display = 'none';
        }
    }

    // Check authentication
    async function checkAuth() {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');

        const userMenuContainer = document.getElementById('userMenuContainer');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const authLinks = document.getElementById('authLinks');
        const chatLink = document.getElementById('chatLink');
        const settingsLink = document.getElementById('settingsLink');

        if (token && userStr) {
            try {
                const res = await fetch(API_BASE_URL + '/Users/me', {
                    headers: authHeaders()
                });

                if (!res.ok) throw new Error(`Error: ${res.status}`);

                const result = await res.json();
                if (result.statusCode !== 200 || !result.data) {
                    throw new Error(result.message || 'Invalid response');
                }

                const user = result.data;
                userName.textContent = user.name || user.email || 'Felhasználó';

                // Avatar / profile picture
                if (user.profilePicture && user.profilePicture.trim() !== '') {
                    const imageUrl = user.profilePicture.startsWith('http') 
                        ? user.profilePicture 
                        : `${window.location.origin}${user.profilePicture.startsWith('/') ? '' : '/'}${user.profilePicture}`;
                    
                    userAvatar.style.backgroundImage = `url(${imageUrl})`;
                    userAvatar.style.backgroundSize = 'cover';
                    userAvatar.style.backgroundPosition = 'center';
                    userAvatar.style.backgroundRepeat = 'no-repeat';
                    userAvatar.textContent = '';
                } else {
                    const initial = (user.name || user.email || '?')[0].toUpperCase();
                    userAvatar.textContent = initial;
                    userAvatar.style.backgroundImage = '';
                }

                userMenuContainer.classList.add('visible');
                authLinks.classList.add('hidden');

                if (chatLink && (user.role === 'student' || user.role === 'instructor' || user.role === 'admin')) {
                    chatLink.style.display = 'inline-flex';
                }

                if (settingsLink) {
                    settingsLink.style.display = 'inline-flex';
                }

                localStorage.setItem('user', JSON.stringify(user));
                sessionStorage.setItem('user', JSON.stringify(user));

            } catch (err) {
                console.error('checkAuth error:', err);
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                showNotLoggedIn();
            }
        } else {
            showNotLoggedIn();
        }
    }

    function showNotLoggedIn() {
        const userMenuContainer = document.getElementById('userMenuContainer');
        const authLinks = document.getElementById('authLinks');
        const chatLink = document.getElementById('chatLink');
        const settingsLink = document.getElementById('settingsLink');

        if (userMenuContainer) userMenuContainer.classList.remove('visible');
        if (authLinks) authLinks.classList.remove('hidden');
        if (chatLink) chatLink.style.display = 'none';
        if (settingsLink) settingsLink.style.display = 'none';
    }

    // User dropdown toggle
    const userTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');

    if (userTrigger && userDropdown) {
        userTrigger.addEventListener('click', function(e) {
            e.stopPropagation();
            userDropdown.classList.toggle('visible');
            userTrigger.classList.toggle('active');
        });

        document.addEventListener('click', function(e) {
            if (window.innerWidth >= 992) {
                if (!userTrigger.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.classList.remove('visible');
                    userTrigger.classList.remove('active');
                }
            }
        });
    }

    // Logout
    document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('user');
        
        alert('Sikeresen kijelentkeztél!');
        window.location.href = 'pro.html';
    });

    // Message display
    function showMessage(message, type = 'info') {
        const messageBox = document.getElementById('messageBox');
        if (!messageBox) return;
        messageBox.textContent = message;
        messageBox.className = 'message-box ' + type;
        messageBox.style.display = 'block';
        setTimeout(() => { messageBox.style.display = 'none'; }, 5000);
    }

    // Load courses from API
    async function loadCourses() {
        const container = document.getElementById('coursesContainer');
        if (!container) return;

        try {
            const response = await fetch(API_BASE_URL + '/Courses/getAllCourses');
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            console.log('Backend response:', data);

            // Check different possible data structures
            let courses = [];
            if (data.data && Array.isArray(data.data)) {
                courses = data.data;
            } else if (data.courses && Array.isArray(data.courses)) {
                courses = data.courses;
            } else if (Array.isArray(data)) {
                courses = data;
            }

            displayCourses(courses);

        } catch (error) {
            console.error('Error loading courses:', error);
            container.innerHTML = `
                <div class="empty-state">
                    <i class='bx bx-error-circle'></i>
                    <p>Hiba történt a tanfolyamok betöltése során.</p>
                </div>
            `;
        }
    }

    // Display courses in cards
    function displayCourses(courses) {
        const container = document.getElementById('coursesContainer');
        if (!container) return;
        
        container.innerHTML = '';

        if (!courses || courses.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class='bx bx-book-open'></i>
                    <p>Jelenleg nincsenek elérhető tanfolyamok.</p>
                </div>
            `;
            return;
        }

        courses.forEach(course => {
            const card = document.createElement('div');
            card.className = 'course-card';
            
            const title = course.title || course.name || 'Név nélküli tanfolyam';
            const description = course.description || 'Nincs leírás megadva a tanfolyamhoz.';
            const price = course.price ? parseInt(course.price) : 0;
            
            // Date formatting
            let dateDisplay = '';
            if (course.start_date || course.startDate) {
                const startDate = new Date(course.start_date || course.startDate);
                const endDate = course.end_date || course.endDate ? new Date(course.end_date || course.endDate) : null;
                
                const startStr = startDate.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });
                const endStr = endDate ? endDate.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
                
                dateDisplay = `
                    <div class="course-meta">
                        <i class='bx bx-calendar'></i>
                        <span>${startStr}${endStr ? ' - ' + endStr : ''}</span>
                    </div>
                `;
            }
            
            card.innerHTML = `
                <div class="course-header">
                    <div class="course-icon">
                        <i class='bx bx-book-reader'></i>
                    </div>
                    ${dateDisplay}
                </div>
                <div class="course-content">
                    <h3>${title}</h3>
                    <div class="course-description">${description}</div>
                </div>
                <div class="course-footer">
                    <div class="course-price">
                        <i class='bx bx-purchase-tag'></i>
                        <strong>${price.toLocaleString('hu-HU')} Ft</strong>
                    </div>
                    <button class="btn-enroll" onclick="enrollCourse(${course.id})">
                        <i class='bx bx-check-circle'></i>
                        Jelentkezés
                    </button>
                </div>
            `;
            
            container.appendChild(card);
        });
    }

    // Enroll in course
    async function enrollCourse(courseId) {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        
        if (!token) {
            showMessage('A jelentkezéshez be kell jelentkezned!', 'error');
            setTimeout(() => {
                window.location.href = 'bejelentkezes.html';
            }, 1500);
            return;
        }

        try {
            const response = await fetch(API_BASE_URL + '/Enrollments/enroll', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ course_id: courseId })
            });

            const result = await response.json();

            if (response.ok) {
                showMessage('Sikeresen jelentkeztél a tanfolyamra!', 'success');
            } else {
                showMessage(result.message || 'Hiba történt a jelentkezés során.', 'error');
            }
        } catch (error) {
            console.error('Enrollment error:', error);
            showMessage('Hiba történt a jelentkezés során.', 'error');
        }
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', async function(){
        await checkAuth();
        await checkMyCoursesNav();
        await loadCourses();
    });
</script>
</body>
</html>
