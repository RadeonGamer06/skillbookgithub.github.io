<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBook – Tanfolyamaink</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <style>
    :root{
      --bg-1:#070a14;
      --bg-2:#0f1731;
      --card: rgba(255,255,255,.08);
      --card-2: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.14);
      --text:#f3f6ff;
      --muted: rgba(243,246,255,.72);
      --accent:#60a5fa;
      --accent-2:#a78bfa;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
      --radius: 20px;
    }
  
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 540px at 18% 12%, rgba(167,139,250,.35), transparent 60%),
        radial-gradient(900px 540px at 86% 22%, rgba(96,165,250,.28), transparent 55%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      overflow-x:hidden;
      min-height: 100vh;
    }
  
    body::before{
      content:"";
      position:fixed;
      inset:-120px -140px auto auto;
      width:560px;
      height:560px;
      background: radial-gradient(circle at 35% 35%, rgba(96,165,250,.45), transparent 62%);
      filter: blur(55px);
      opacity:.55;
      z-index:-1;
      animation: floatGlow 12s ease-in-out infinite;
    }
    @keyframes floatGlow{
      0%,100%{ transform: translate3d(0,0,0) rotate(0deg); }
      50%{ transform: translate3d(-20px, 16px, 0) rotate(10deg); }
    }
  
    header{
      position: sticky;
      top:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:18px 26px;
      background: rgba(7,10,20,.58);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .logo{
      display:flex;
      align-items:baseline;
      gap:2px;
      font-size: 1.4rem;
      letter-spacing:.4px;
    }
    .logo span{ color: var(--muted); font-weight:600; }
    .logo strong{
      color: var(--text);
      font-weight: 800;
      background: linear-gradient(135deg, rgba(96,165,250,1), rgba(167,139,250,1));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
    }
    nav{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    nav a{
      color: var(--text);
      text-decoration:none;
      padding:10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    nav a:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.22);
    }
    nav a.active{
      background: linear-gradient(135deg, rgba(96,165,250,.42), rgba(167,139,250,.26));
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 12px 36px rgba(96,165,250,.16);
    }
  
    main{
      width:min(1100px, calc(100% - 40px));
      margin: 28px auto 40px;
    }

    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h2{
      margin: 0;
      font-size: 1.05rem;
      letter-spacing:.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #addCourseBtn {
      display: none;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(135deg, rgba(96,165,250,.95), rgba(167,139,250,.85));
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 35px rgba(0,0,0,.35);
      transition: transform .18s ease, filter .18s ease;
      font-size: 0.95rem;
    }
    #addCourseBtn:hover { 
      transform: translateY(-2px); 
      filter: brightness(1.05); 
    }
    #addCourseBtn:active { 
      transform: translateY(0px) scale(.99); 
    }
    #addCourseBtn i {
      margin-right: 6px;
    }
  
    .courses{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }
  
    .course-card{
      display:block;
      padding: 18px 18px 16px;
      border-radius: var(--radius);
      text-decoration:none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transform: translateY(0);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      animation: fadeUp .5s ease both;
      cursor: pointer;
    }
    @keyframes fadeUp{
      from{ opacity:0; transform: translateY(10px); }
      to{ opacity:1; transform: translateY(0); }
    }
  
    .course-card:hover{
      transform: translateY(-6px);
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 28px 70px rgba(0,0,0,.45);
    }
    .course-card h3{
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .course-card p{
      margin: 7px 0;
      color: var(--muted);
      line-height: 1.35;
      font-size: 0.9rem;
    }
    .course-card strong, .course-card b{
      color: var(--text);
      font-weight: 650;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state i {
      font-size: 4rem;
      opacity: 0.3;
      margin-bottom: 16px;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
      margin: 5% auto;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: min(500px, calc(100% - 40px));
      box-shadow: 0 30px 90px rgba(0,0,0,.6);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close {
      position: absolute;
      right: 18px;
      top: 18px;
      font-size: 28px;
      font-weight: bold;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .close:hover {
      color: var(--text);
    }

    .modal h3 {
      margin: 0 0 20px;
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
      color: var(--text);
      outline: none;
      font-size: 15px;
      transition: all 0.18s ease;
      font-family: inherit;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: rgba(96,165,250,0.65);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.18);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(96,165,250,.95), rgba(167,139,250,.85));
      color: var(--text);
      box-shadow: 0 14px 35px rgba(0,0,0,.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }
    .btn-secondary {
      background: rgba(255,255,255,.05);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,.08);
    }

    .message-box {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      z-index: 1001;
      display: none;
      animation: slideIn 0.3s ease;
      backdrop-filter: blur(12px);
      font-size: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
      color: var(--text);
      max-width: 400px;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .message-box.success {
      border-color: rgba(77,212,172,0.45);
      color: #c9ffef;
      background: rgba(77,212,172,0.08);
    }
    .message-box.error {
      border-color: rgba(255,107,107,0.45);
      color: #ffd0d0;
      background: rgba(255,107,107,0.08);
    }
  
    footer{
      width:100%;
      text-align:center;
      padding: 22px 14px;
      color: rgba(243,246,255,.65);
      border-top: 1px solid rgba(255,255,255,.10);
      background: rgba(7,10,20,.35);
      backdrop-filter: blur(10px);
      margin-top: auto;
    }
  
    @media (max-width:520px){
      header{ padding: 14px 14px; }
      nav a{ padding: 9px 12px; }
      main{ width: calc(100% - 28px); }
      .courses {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>
<body>

  <!-- Message Box -->
  <div id="messageBox" class="message-box"></div>

  <!-- Modal for adding course -->
  <div id="courseModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Új tanfolyam létrehozása</h3>
      <form id="courseForm">
        <div class="form-group">
          <label for="courseTitle">Tanfolyam címe *</label>
          <input type="text" id="courseTitle" required placeholder="pl. Angol kezdőknek">
        </div>
        <div class="form-group">
          <label for="courseCategory">Kategória *</label>
          <input type="text" id="courseCategory" required placeholder="pl. Nyelvtanulás">
        </div>
        <div class="form-group">
          <label for="coursePrice">Ár (Ft) *</label>
          <input type="number" id="coursePrice" required placeholder="20000">
        </div>
        <div class="form-group">
          <label for="courseStartDate">Kezdés dátuma *</label>
          <input type="date" id="courseStartDate" required>
        </div>
        <div class="form-group">
          <label for="courseEndDate">Befejezés dátuma *</label>
          <input type="date" id="courseEndDate" required>
        </div>
        <div class="form-group">
          <label for="courseDescription">Leírás</label>
          <textarea id="courseDescription" placeholder="Rövid leírás a tanfolyamról..."></textarea>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-secondary" onclick="closeModal()">Mégse</button>
          <button type="submit" class="btn-primary">Létrehozás</button>
        </div>
      </form>
    </div>
  </div>

  <header>
    <div class="logo">
      <span>Skill</span><strong>Book</strong>
    </div>
    <nav>
      <a href="pro.html">Kezdőlap</a>
      <a href="courses.html" class="active">Tanfolyamok</a>
      <a href="#">Naptár</a>
      <a href="#">Kapcsolat</a>
      <a href="bejelentkezes.html" id="loginLink">Bejelentkezés</a>
      <a href="regisztracio.html" id="registerLink">Regisztráció</a>
      <a href="#" id="logoutLink" style="display:none;" onclick="logout()">Kijelentkezés</a>
    </nav>
  </header>

  <main>
    <div class="header-section">
      <h2>TANFOLYAMAINK:</h2>
      <button id="addCourseBtn" onclick="openModal()">
        <i class='bx bx-plus'></i>
        Tanfolyam hozzáadása
      </button>
    </div>

    <div class="courses" id="coursesContainer">
      <!-- Courses will be loaded here dynamically -->
    </div>
  </main>

  <footer>
    <p>2025 | SkillBook</p>
  </footer>

  <script>
    const API_BASE_URL = '/SkillBook/api';
    let currentUser = null;

    // Check if user is logged in and get user info
    async function checkAuth() {
      const token = localStorage.getItem('token');
      
      if (token) {
        try {
          const response = await fetch(API_BASE_URL + '/Users/me', {
            headers: {
              'Authorization': 'Bearer ' + token
            }
          });

          if (response.ok) {
            const data = await response.json();
            currentUser = data.data;
            
            // Update UI based on user role
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('registerLink').style.display = 'none';
            document.getElementById('logoutLink').style.display = 'block';
            
            // Show add course button if user is instructor
            if (currentUser.role === 'instructor') {
              document.getElementById('addCourseBtn').style.display = 'block';
            }
          } else {
            // Token invalid, clear it
            localStorage.removeItem('token');
          }
        } catch (error) {
          console.error('Auth check error:', error);
        }
      }
    }

    // Load courses from backend
    async function loadCourses() {
      try {
        const response = await fetch(API_BASE_URL + '/Courses/getAllCourses');
        
        if (response.ok) {
          const data = await response.json();
          displayCourses(data.data || []);
        } else {
          console.error('Failed to load courses');
          displayCourses([]);
        }
      } catch (error) {
        console.error('Error loading courses:', error);
        // Show example courses for now
        displayCourses([]);
      }
    }

    // Display courses
    function displayCourses(courses) {
      const container = document.getElementById('coursesContainer');
      
      if (courses.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class='bx bx-book-open'></i>
            <p>Még nincsenek tanfolyamok. ${currentUser?.role === 'instructor' ? 'Hozd létre az elsőt!' : 'Nézz vissza később!'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = courses.map((course, index) => `
        <div class="course-card" style="animation-delay: ${index * 0.06}s" onclick="viewCourse(${course.id})">
          <h3>${course.title || course.name}</h3>
          <p><strong>Kategória:</strong> ${course.category || 'Egyéb'}</p>
          <p><strong>Ár:</strong> ${formatPrice(course.price)} Ft</p>
          <p><strong>Időpont:</strong> ${formatDate(course.start_date)} – ${formatDate(course.end_date)}</p>
          <p><strong>Tanár:</strong> ${course.instructor_name || 'Ismeretlen'}</p>
        </div>
      `).join('');
    }

    // Format price
    function formatPrice(price) {
      return new Intl.NumberFormat('hu-HU').format(price);
    }

    // Format date
    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('hu-HU');
    }

    // Open modal
    function openModal() {
      document.getElementById('courseModal').style.display = 'block';
    }

    // Close modal
    function closeModal() {
      document.getElementById('courseModal').style.display = 'none';
      document.getElementById('courseForm').reset();
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('courseModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    // Close button
    document.querySelector('.close').onclick = closeModal;

    // Handle form submission
    document.getElementById('courseForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const token = localStorage.getItem('token');
      if (!token) {
        showMessage('Jelentkezz be a tanfolyam létrehozásához!', 'error');
        return;
      }

      const courseData = {
        title: document.getElementById('courseTitle').value,
        category: document.getElementById('courseCategory').value,
        price: parseInt(document.getElementById('coursePrice').value),
        start_date: document.getElementById('courseStartDate').value,
        end_date: document.getElementById('courseEndDate').value,
        description: document.getElementById('courseDescription').value
      };

      try {
        const response = await fetch(API_BASE_URL + '/Courses/createCourse', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(courseData)
        });

        const data = await response.json();

        if (response.ok && (data.statusCode === 201 || data.status === 'CourseCreated')) {
          showMessage('✅ Tanfolyam sikeresen létrehozva!', 'success');
          closeModal();
          loadCourses(); // Reload courses
        } else {
          showMessage('❌ Hiba történt: ' + (data.message || 'Próbáld újra!'), 'error');
        }
      } catch (error) {
        console.error('Error creating course:', error);
        showMessage('❌ Nem sikerült kapcsolódni a szerverhez!', 'error');
      }
    });

    // View course details (placeholder for now)
    function viewCourse(courseId) {
      showMessage('Tanfolyam részletek hamarosan...', 'success');
      // Later: navigate to course details page
      // window.location.href = 'course-details.html?id=' + courseId;
    }

    // Logout
    function logout() {
      localStorage.removeItem('token');
      currentUser = null;
      window.location.href = 'pro.html';
    }

    // Show message
    function showMessage(message, type = 'info') {
      const messageBox = document.getElementById('messageBox');
      messageBox.textContent = message;
      messageBox.className = 'message-box ' + type;
      messageBox.style.display = 'block';

      setTimeout(() => {
        messageBox.style.display = 'none';
      }, 5000);
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', function() {
      checkAuth();
      loadCourses();
    });
  </script>

</body>
</html>
