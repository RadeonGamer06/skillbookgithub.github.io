<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBook - Csevegés</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/x-icon" href="fav.png">
    <style>
        :root {
            --bg-1: #f5f3ff;
            --bg-2: #e9d5ff;
            --card: rgba(255,255,255,0.85);
            --border: rgba(139,92,246,0.2);
            --text: #1e1b4b;
            --muted: rgba(30,27,75,0.65);
            --accent: #7c3aed;
            --accent-2: #059669;
            --radius: 4px;
        }

        
        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        


        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #e9d5ff 0%, #d1fae5 50%, #ddd6fe 100%);
            background-attachment: fixed;
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header styles */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 26px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        /* Hamburger menü gomb */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all .18s ease;
        }

        .menu-toggle:hover {
            background: rgba(255,255,255,0.9);
            border-color: var(--accent);
        }

        .menu-toggle span {
            width: 20px;
            height: 2px;
            background: var(--text);
            border-radius: 4px;
            transition: all .3s ease;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-size: 1.4rem;
            letter-spacing: .4px;
            text-decoration: none;
        }
        .logo span { color: var(--muted); font-weight: 600; }
        .logo strong {
            color: var(--text);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }
        nav a, nav button {
            color: var(--text);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.6);
            transition: transform .18s ease, background .18s ease, border-color .18s ease;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
        }
        nav a:hover, nav button:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.9);
            border-color: var(--accent);
        }
        nav a.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 24px rgba(124,58,237,0.2);
        }

        .auth-links {
            display: flex;
            gap: 10px;
        }
        .auth-links.hidden {
            display: none;
        }

        .user-menu-container {
            position: relative;
            display: none;
        }
        .user-menu-container.visible {
            display: block;
        }

        .user-menu-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.18s;
        }
        .user-menu-trigger:hover {
            background: rgba(255,255,255,0.6);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .dropdown-arrow {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            min-width: 180px;
            box-shadow: 0 10px 40px rgba(124,58,237,0.15);
            overflow: hidden;
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: all 0.18s ease;
            z-index: 100;
        }
        .user-dropdown.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .dropdown-item {
            display: block;
            width: 100%;
            padding: 10px 16px;
            color: var(--text);
            text-decoration: none;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .dropdown-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        .logout {
            color: #ff6b6b !important;
        }
        .logout:hover {
            background: rgba(255,107,107,0.15) !important;
        }
        
        @media (max-width: 991px) {
            .menu-toggle {
                display: flex;
            }

            nav {
                position: absolute;
                top: 100%;
                right: 0;
                left: 0;
                background: rgba(0, 0, 0, 0.92);
                backdrop-filter: blur(14px);
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                align-items: stretch;
                padding: 16px 26px;
                gap: 8px;
                max-height: 0;
                overflow: hidden;
                opacity: 0;
                transition: all .3s ease;
            }

            nav.active {
                max-height: 500px;
                opacity: 1;
            }
            
            nav a, nav button {
                color: white;
                border-color: rgba(255,255,255,0.3);
                background: rgba(255,255,255,0.15);
            }
            
            nav a:hover, nav button:hover {
                background: rgba(255,255,255,0.25);
                border-color: rgba(255,255,255,0.5);
            }
            
            nav a.active {
                background: rgba(255,255,255,0.3);
                border-color: rgba(255,255,255,0.6);
            }
            
            .user-menu-trigger {
                background: rgba(255,255,255,0.15);
                border: 1px solid rgba(255,255,255,0.3);
            }
            
            .user-name {
                color: white;
            }
            
            .dropdown-arrow {
                color: white;
            }
        }

        /* Elrendezés */
        .chat-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            flex: 1;
            background: var(--bg-1);
        }

        /* Bal oszlop - Sidebar */
        .sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.6);
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .search-container input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 4px;
            color: var(--text);
            outline: none;
        }

        .user-lists {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .list-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            margin: 15px 10px 10px;
            letter-spacing: 1px;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
        }

        .user-item:hover { background: var(--card); }
        .user-item.active { background: var(--accent); color: white; }

        .chat-user-avatar {
            width: 40px;
            height: 40px;
            background: var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
        }

        /* Jobb oszlop - Chat felület */
        .chat-main {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.4);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            background: rgba(255,255,255,0.6);
        }

        #messagesContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .sent {
            align-self: flex-end;
            background: var(--accent);
            color: white;
        }

        .received {
            align-self: flex-start;
            background: var(--card);
            border: 1px solid var(--border);
        }

        .message-input-area {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.6);
        }

        .message-input-area input {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 4px;
            color: var(--text);
            outline: none;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Dark Mode - Backgrounds AND Text Colors */
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            background-attachment: fixed;
            color: #f1f5f9;
        }

        [data-theme="dark"] body::before {
            background: radial-gradient(circle at 35% 35%, rgba(124,58,237,0.15), transparent 62%);
            opacity: .3;
        }

        [data-theme="dark"] header {
            background: rgba(30,41,59,0.9);
        }

        [data-theme="dark"] nav a,
        [data-theme="dark"] nav button {

            color: #f1f5f9;
        }

        [data-theme="dark"] nav a:hover,
        [data-theme="dark"] nav button:hover {
            background: rgba(51,65,85,0.9);
            color: #f1f5f9;
        }

        [data-theme="dark"] .user-menu-trigger {

        }

        [data-theme="dark"] .user-menu-trigger:hover {

        }

        [data-theme="dark"] .user-name {
            color: #f1f5f9;
        }

        [data-theme="dark"] .dropdown-arrow {
            color: #f1f5f9;

            background: rgba(30,41,59,0.98);
        }

        [data-theme="dark"] .dropdown-item {
            color: #f1f5f9;
        }

        [data-theme="dark"] .dropdown-item:hover {
            background: rgba(124,58,237,0.25);
        }

        [data-theme="dark"] footer {
            background: rgba(30,41,59,0.9);
            color: #f1f5f9;
        }

        [data-theme="dark"] main {
            background: rgba(30,41,59,0.9);
        }

        [data-theme="dark"] .card,
        [data-theme="dark"] .course-card {
            background: rgba(30,41,59,0.9);
        }

        [data-theme="dark"] .card:hover,
        [data-theme="dark"] .course-card:hover {
            background: rgba(51,65,85,0.95);
        }

        [data-theme="dark"] .info-card {
            background: rgba(30,41,59,0.9);
        }

        [data-theme="dark"] .info-card:hover {
            background: rgba(51,65,85,0.9);
        }

        [data-theme="dark"] .contact-form {
            background: rgba(30,41,59,0.9);
        }

        [data-theme="dark"] .modal-content {
            background: rgba(30,41,59,0.95);
        }

        [data-theme="dark"] .modal {
            background: rgba(0,0,0,0.85);
        }

        [data-theme="dark"] input,
        [data-theme="dark"] textarea,
        [data-theme="dark"] select,
        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select {

        }

        [data-theme="dark"] input::placeholder,

        [data-theme="dark"] input:focus,

        }

        [data-theme="dark"] .feature-card {
            background: rgba(30,41,59,0.8);
        }

        [data-theme="dark"] .feature-card:hover {

        }

        [data-theme="dark"] .sidebar {
            background: rgba(30,41,59,0.8);
        }

        [data-theme="dark"] .chat-main {
            background: rgba(15,23,42,0.6);
        }

        [data-theme="dark"] .chat-header {
            background: rgba(30,41,59,0.8);
            color: #f1f5f9;
        }

        [data-theme="dark"] .message.received {
            background: rgba(30,41,59,0.9);
            color: #f1f5f9;
        }

        [data-theme="dark"] .message-box {
            background: rgba(30,41,59,0.95);
            color: #f1f5f9;
        }

        [data-theme="dark"] .menu-toggle span {

        }

        [data-theme="dark"] .menu-toggle {

        }

        [data-theme="dark"] .menu-toggle:hover {
            background: rgba(51,65,85,0.9);
        }

        [data-theme="dark"] .about {

        }

        [data-theme="dark"] .stat-item {

        }

        [data-theme="dark"] .cta-section {
            background: rgba(30,41,59,0.8);
        }

        [data-theme="dark"] .map-section {
            background: rgba(30,41,59,0.8);
        }

        [data-theme="dark"] .search-container input {

        }

        }

        [data-theme="dark"] .user-item:hover {

        }

        [data-theme="dark"] .message-input-area {
            background: rgba(30,41,59,0.8);
        }

        [data-theme="dark"] .message-input-area input {

        [data-theme="dark"] .about-image img {

        }

        [data-theme="dark"] h3,

        }

<body>

    <header>
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle" aria-label="Menu toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="pro.html" class="logo">
                <span>Skill</span><strong>Book</strong>
            </a>
        </div>

        <nav id="mainNav">
            <a href="pro.html">Kezdőlap</a>
            <a href="courses.html">Tanfolyamok</a>
            <a href="my-courses.html" id="myCoursesNav" style="display:none;">Tanfolyamaim</a>
            <a href="kapcsolat.html">Kapcsolat</a>
            <a href="chat.html" class="active">Csevegés</a>

            <div id="authLinks" class="auth-links">
                <a href="bejelentkezes.html">Bejelentkezés</a>
                <a href="regisztracio.html">Regisztráció</a>
            </div>

            <div class="user-menu-container" id="userMenuContainer">
                <button class="user-menu-trigger" id="userMenuTrigger">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">?</div>
                        <span class="user-name" id="userName">Vendég</span>
                    </div>
                    <span class="dropdown-arrow">▼</span>
                </button>

                <div class="user-dropdown" id="userDropdown">
                    <a href="fiok.html" class="dropdown-item">Fiókom</a>
                    <a href="beallitasok.html" class="dropdown-item">Beállítások</a>
                    <div class="dropdown-divider"></div>
                    <button id="logoutBtnNav" class="dropdown-item logout">Kijelentkezés</button>
                </div>
            </div>
        </nav>
    </header>

    <div class="chat-container">
        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="userSearch" placeholder="Felhasználó keresése...">
            </div>
            
            <div class="user-lists" id="userLists">
                <div class="list-section-title">Korábbi beszélgetések</div>
                <div id="recentChats"></div>
                
                <div class="list-section-title">Összes felhasználó</div>
                <div id="allUsersList"></div>
            </div>
        </div>

        <div class="chat-main">
            <div class="chat-header" id="chatPartnerName">Válassz egy partnert a kezdéshez</div>
            
            <div id="messagesContainer">
            </div>

            <form class="message-input-area" id="messageForm">
                <input type="text" id="messageInput" placeholder="Írj egy üzenetet..." autocomplete="off">
                <button type="submit" class="send-btn"><i class='bx bxs-send'></i></button>
            </form>
        </div>
    </div>
    
    <script>
    const API_BASE_URL = '/SkillBook/api';

    // Apply saved theme immediately
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();

    // Segédfüggvény az auth header-hez
    function authHeaders() {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        return {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
    }

    // Hamburger menü toggle
    const menuToggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('nav');

    if (menuToggle && nav) {
        menuToggle.addEventListener('click', () => {
            nav.classList.toggle('active');
        });
    }

    // Ellenőrzi, hogy van-e legalább egy saját kurzusa az oktatónak
    async function checkMyCoursesNav() {
        const link = document.getElementById('myCoursesNav');
        if (!link) return;

        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
        if (!token || !userStr) { link.style.display = 'none'; return; }

        let user;
        try { user = JSON.parse(userStr); } catch(e) { link.style.display = 'none'; return; }

        if (!user || user.role !== 'instructor') { link.style.display = 'none'; return; }

        try {
            const meRes = await fetch(API_BASE_URL + '/Users/me', { headers: authHeaders() });
            if (!meRes.ok) { link.style.display = 'none'; return; }
            const meJson = await meRes.json();
            const myId = meJson?.data?.id;
            if (!myId) { link.style.display = 'none'; return; }

            const cRes = await fetch(API_BASE_URL + '/Courses/getAllCourses');
            if (!cRes.ok) { link.style.display = 'none'; return; }
            const cJson = await cRes.json();
            const courses = Array.isArray(cJson?.data) ? cJson.data : [];
            const myCourses = courses.filter(c => String(c.instructor_id) === String(myId));

            link.style.display = myCourses.length > 0 ? 'inline-flex' : 'none';
        } catch (e) {
            link.style.display = 'none';
        }
    }

    async function checkAuth() {
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');

        const userMenuContainer = document.getElementById('userMenuContainer');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const authLinks = document.getElementById('authLinks');
        const chatLink = document.getElementById('chatLink');

        if (token && userStr) {
            try {
                // Friss adatokat kérünk a backendtől (profilkép miatt is)
                const res = await fetch(API_BASE_URL + '/Users/me', {
                    headers: authHeaders()
                });

                if (!res.ok) {
                    throw new Error(`Hiba: ${res.status} - ${res.statusText}`);
                }

                const result = await res.json();

                if (result.statusCode !== 200 || !result.data) {
                    throw new Error(result.message || 'Hibás válasz a szervertől');
                }

                const user = result.data;

                // Név frissítése
                userName.textContent = user.name || user.email || 'Felhasználó';

                // Avatar / profilkép logika
                if (user.profilePicture && user.profilePicture.trim() !== '') {
                    // Van feltöltött kép
                    const imageUrl = user.profilePicture.startsWith('http') 
                        ? user.profilePicture 
                        : `${window.location.origin}${user.profilePicture.startsWith('/') ? '' : '/'}${user.profilePicture}`;
                    
                    userAvatar.style.backgroundImage = `url(${imageUrl})`;
                    userAvatar.style.backgroundSize = 'cover';
                    userAvatar.style.backgroundPosition = 'center';
                    userAvatar.style.backgroundRepeat = 'no-repeat';
                    userAvatar.textContent = '';
                } else {
                    // Nincs kép → inicial
                    const initial = (user.name || user.email || '?')[0].toUpperCase();
                    userAvatar.textContent = initial;
                    userAvatar.style.backgroundImage = '';
                }

                // Láthatóságok
                userMenuContainer.classList.add('visible');
                authLinks.classList.add('hidden');

                if (chatLink && (user.role === 'student' || user.role === 'instructor' || user.role === 'admin')) {
                    chatLink.style.display = 'inline-flex';
                }

                // Frissítjük a localStorage-t is
                localStorage.setItem('user', JSON.stringify(user));
                sessionStorage.setItem('user', JSON.stringify(user));

            } catch (err) {
                console.error('checkAuth hiba:', err);
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                showNotLoggedIn();
            }
        } else {
            showNotLoggedIn();
        }
    }

    function showNotLoggedIn() {
        const userMenuContainer = document.getElementById('userMenuContainer');
        const authLinks = document.getElementById('authLinks');
        const chatLink = document.getElementById('chatLink');

        if (userMenuContainer) userMenuContainer.classList.remove('visible');
        if (authLinks) authLinks.classList.remove('hidden');
        if (chatLink) chatLink.style.display = 'none';
    }

    // User dropdown toggle
    const userTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');

    if (userTrigger && userDropdown) {
        userTrigger.addEventListener('click', function(e) {
            e.stopPropagation();
            userDropdown.classList.toggle('visible');
            userTrigger.classList.toggle('active');
        });

        document.addEventListener('click', function(e) {
            if (window.innerWidth >= 992) {
                if (!userTrigger.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.classList.remove('visible');
                    userTrigger.classList.remove('active');
                }
            }
        });
    }

    // Kijelentkezés
    document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('user');
        
        alert('Sikeresen kijelentkeztél!');
        window.location.href = 'pro.html';
    });

    // Inicializálás
    document.addEventListener('DOMContentLoaded', async function(){
        await checkAuth();
        await checkMyCoursesNav();
    });
</script>
